skyline_district = 0

gameui_begin_ids

ui_gameui_main_dims = [0.5 0.6]

# ui_gameui_main = [
    uivlist 0 [
        uiimage $logotex 0xffffff 1 0.46 0.23

        ui_gameui_prettybutton [
            p_label = (concat "District:" (at ["Braamfontein Heights" "Lagos Lagoon Terminal" "Rift Valley Relay"] $skyline_district))
            p_tip = "Choose a fictional African-inspired district"
            p_on_click = [skyline_district = (mod (+ $skyline_district 1) 3)]
            p_id = #(gameui_get_id prettybutton)
        ]
        ui_gameui_prettybutton [
            p_label = "Practice / 8-player bots"
            p_tip = "Explore the selected district in a team skirmish"
            p_on_click = [
                gameui_close_all
                botlimit 16
                botbalance 8
                botskillmin 35
                botskillmax 55
                teamalphaname "Jozi Falcons"
                teamomeganame "Lagos Comets"
                timelimit 10
                start (at ["maps/skyline/heights" "maps/skyline/lagoon" "maps/skyline/rift"] $skyline_district) 2 0
            ]
            p_id = #(gameui_get_id prettybutton)
        ]
        ui_gameui_prettybutton [
            p_label = "PvE / Rogue Machines"
            p_tip = "Drones, rollers, guards and an elite turret; experimental encounter"
            p_on_click = [
                gameui_close_all
                botlimit 0
                botbalance 0
                enemylimit 12
                enemyskillmin 35
                enemyskillmax 55
                enemyspawntime 20000
                timelimit 10
                start (at ["maps/skyline/heights" "maps/skyline/lagoon" "maps/skyline/rift"] $skyline_district) 2 258
            ]
            p_id = #(gameui_get_id prettybutton)
        ]
        uicolourtext "PLAYTEST 0.2 / Private hosting: skyline-room.bat" 0xaaaaaa 0.55

        if $isconnected [
            ui_gameui_prettybutton [
                p_label    = "Change team"
                p_tip      = "Change your team"
                p_on_click = [
                    gameui_open ui_gameui_team
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        ui_gameui_prettybutton [
            p_label    = "LAN / Direct Connect"
            p_tip      = "Connect to a Skyline Rush test server; no public matchmaking yet"
            p_on_click = [
                gameui_open ui_gameui_online
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = (? $isonline "Vote Map/Mode" "Offline Match")
            p_tip      = (? $isonline "Begin a vote to change the map and/or mode" "Start an offline match with bots")
            p_on_click = [
                if $isonline [
                    gameui_open ui_gameui_vote
                ] [
                    gameui_open ui_gameui_maps
                ]
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label    = "Player Setup"
            p_tip      = "Customize the game profile and player character"
            p_on_click = [
                gameui_open ui_gameui_player
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        if (ismodelocked 2) [] [
            ui_gameui_prettybutton [
                p_label    = "Map Editor"
                p_tip      = "Create and edit maps in-game"
                p_on_click = [
                    gameui_open ui_gameui_editor
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        ui_gameui_prettybutton [
            p_label    = "Settings"
            p_tip      = "Change game, graphics and sound settings"
            p_on_click = [
                gameui_open ui_gameui_settings
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label = "Variables"
            p_tip   = "Search, edit, and save game variables"
            p_on_click = [
                gameui_open ui_gameui_variables
            ]
            p_id    = #(gameui_get_id prettybutton)
        ]

        ui_gameui_prettybutton [
            p_label = "Support"
            p_tip   = "Game support"
            p_on_click = [
                gameui_open ui_gameui_support
            ]
            p_id    = #(gameui_get_id prettybutton)
        ]

        if $isconnected [
            ui_gameui_prettybutton [
                p_label    = "Leave game"
                p_tip      = "Leave the match and go back to the main menu"
                p_on_click = [
                    gameui_confirm "Are you sure you wish to leave this match?" [
                        disconnect
                    ]
                ]
                p_id       = #(gameui_get_id prettybutton)
            ]
        ]

        ui_gameui_prettybutton [
            p_label    = "Quit to desktop"
            p_tip      = "Leave the game and quit to desktop"
            p_on_click = [
                gameui_confirm "Quit the game to desktop?" [
                    quit
                ]
            ]
            p_id       = #(gameui_get_id prettybutton)
        ]

        uifill 0 0.05

        ui_gameui_autoscrollh [
            uicolourtext (? $gameui_hovering $gameui_tip "") 0x88ffffff
        ] [
            p_width = $gameui_panel_new_size
        ]
    ]

    if $isconnected [
        #(ui_gameui_backbutton)
    ]
]

gameui_main_handler = [
    togglescores 0
    gameui_open ui_gameui_main
]
gameui_panel_default = gameui_main_handler
