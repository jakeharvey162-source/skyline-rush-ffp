name: Import Skyline Rush source
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/import-skyline.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned source snapshot with licences and asset references
        run: |
          git fetch --no-tags https://github.com/jakeharvey162-source/skyline-rush.git 98e1c52161c9c12c2d81a20ba42625972888d5ac
          git read-tree --reset -u FETCH_HEAD
          git rm -r --cached --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows/import-skyline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "Import Skyline Rush district playtest source, assets references and website"
          git push origin HEAD:main
