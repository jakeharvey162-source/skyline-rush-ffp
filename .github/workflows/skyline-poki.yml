name: Skyline Rush Poki web checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/poki/**"
      - "tests/poki_requirements.py"
      - ".github/workflows/skyline-poki.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check web/poki/game.js

      - name: Poki hard-requirement static QA
        run: python3 tests/poki_requirements.py web/poki

      - name: Verify upload root and package size
        shell: bash
        run: |
          set -euo pipefail
          test -f web/poki/index.html
          test -f web/poki/style.css
          test -f web/poki/game.js
          bytes=$(du -sb web/poki | cut -f1)
          echo "Poki directory size: $bytes bytes"
          test "$bytes" -lt 1000000

      - name: Build Inspector upload ZIP
        run: |
          cd web/poki
          zip -9 -r ../../skyline-rush-poki.zip . \
            -x "POKI-RELEASE-READINESS.md" "POKI-SUBMISSION.md" "README.md"
          cd ../..
          unzip -l skyline-rush-poki.zip
          test "$(unzip -Z1 skyline-rush-poki.zip | grep -c '^index.html$')" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: skyline-rush-poki-inspector
          path: skyline-rush-poki.zip
          retention-days: 14
